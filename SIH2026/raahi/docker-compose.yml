# Local dev alternative to Supabase — spin a Postgres you can point DATABASE_URL at.
# For real work, use a Supabase project in ap-south-1 (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: raahi
    ports: ["5432:5432"]
    volumes:
      - raahi_pg:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
volumes:
  raahi_pg:
