<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowUp" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
    <style>
      .lbl{font-size:13px;fill:#0f172a;font-weight:600}
      .sub{font-size:10.5px;fill:#475569}
      .band{font-size:12px;fill:#64748b;font-weight:700;letter-spacing:1px}
      .flow{font-size:10px;fill:#64748b;font-style:italic}
    </style>
  </defs>

  <rect width="1280" height="720" fill="#f8fafc"/>

  <!-- Title -->
  <text x="40" y="46" font-size="26" font-weight="800" fill="#0f172a">RAAHI — System Architecture</text>
  <text x="40" y="70" font-size="13.5" fill="#475569">Voice-first AI counsellor for NSQF-aligned skilling · PM-AJAY GIA</text>

  <!-- ================= BAND 1: CHANNELS ================= -->
  <text x="40" y="112" class="band">BENEFICIARY &amp; CHANNELS</text>
  <rect x="40" y="122" width="230" height="96" rx="10" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
  <text x="56" y="148" class="lbl">📞 Beneficiary</text>
  <text x="56" y="168" class="sub">Speaks own language on a call</text>
  <text x="56" y="184" class="sub">Hindi · Bengali · Tamil ·</text>
  <text x="56" y="199" class="sub">Marathi · English</text>

  <rect x="300" y="122" width="230" height="96" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="316" y="148" class="lbl">Channel Adapters</text>
  <text x="316" y="168" class="sub">IVR: Twilio · Exotel · Mock</text>
  <text x="316" y="184" class="sub">WhatsApp: Meta Cloud API</text>
  <text x="316" y="200" class="sub">DTMF fallback · webhooks</text>

  <!-- ================= BAND 2: VOICE API PIPELINE ================= -->
  <text x="40" y="262" class="band">VOICE API  ·  FastAPI (Python 3.11)  —  per-turn pipeline</text>
  <rect x="36" y="274" width="906" height="196" rx="12" fill="#ffffff" stroke="#0d9488" stroke-width="2"/>

  <!-- pipeline stages -->
  <g>
    <rect x="54" y="300" width="128" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="118" y="330" text-anchor="middle" class="lbl">STT</text>
    <text x="118" y="349" text-anchor="middle" class="sub">Sarvam ASR</text>

    <rect x="200" y="300" width="150" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="275" y="326" text-anchor="middle" class="lbl">Extractor (LLM)</text>
    <text x="275" y="343" text-anchor="middle" class="sub">Groq / Gemini / Sarvam</text>
    <text x="275" y="358" text-anchor="middle" class="sub">+ grounding guard</text>

    <rect x="368" y="300" width="138" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="437" y="326" text-anchor="middle" class="lbl">Next-Question</text>
    <text x="437" y="343" text-anchor="middle" class="sub">session state</text>
    <text x="437" y="358" text-anchor="middle" class="sub">i18n prompts</text>

    <rect x="524" y="300" width="132" height="70" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="590" y="326" text-anchor="middle" class="lbl">Ranker</text>
    <text x="590" y="343" text-anchor="middle" class="sub">SQL scoring in</text>
    <text x="590" y="358" text-anchor="middle" class="sub">Postgres</text>

    <rect x="674" y="300" width="128" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="738" y="326" text-anchor="middle" class="lbl">Composer</text>
    <text x="738" y="343" text-anchor="middle" class="sub">LLM → spoken</text>
    <text x="738" y="358" text-anchor="middle" class="sub">reason per path</text>

    <rect x="820" y="300" width="106" height="70" rx="8" fill="#f0fdfa" stroke="#0d9488"/>
    <text x="873" y="330" text-anchor="middle" class="lbl">TTS</text>
    <text x="873" y="349" text-anchor="middle" class="sub">Sarvam voice</text>

    <!-- inner arrows -->
    <line x1="182" y1="335" x2="198" y2="335" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="350" y1="335" x2="366" y2="335" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="506" y1="335" x2="522" y2="335" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="656" y1="335" x2="672" y2="335" stroke="#64748b" marker-end="url(#arrow)"/>
    <line x1="802" y1="335" x2="818" y2="335" stroke="#64748b" marker-end="url(#arrow)"/>
  </g>

  <!-- pack sender -->
  <rect x="54" y="398" width="872" height="52" rx="8" fill="#eef2ff" stroke="#6366f1"/>
  <text x="70" y="419" class="lbl">Pack Sender</text>
  <text x="70" y="438" class="sub">Delivers 3 ranked NSQF pathways + spoken reason back to the caller (voice) and as a WhatsApp pack</text>

  <!-- ================= RIGHT: OFFICER DASHBOARD ================= -->
  <text x="972" y="262" class="band">OFFICER</text>
  <rect x="972" y="274" width="268" height="196" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="990" y="304" class="lbl">🖥️ Officer Dashboard</text>
  <text x="990" y="326" class="sub">Next.js 14 (App Router)</text>
  <text x="990" y="346" class="sub">Per-district cohort view</text>
  <text x="990" y="366" class="sub">Recommendations &amp; sessions</text>
  <text x="990" y="386" class="sub">Demand vs. supply signals</text>
  <line x1="990" y1="402" x2="1222" y2="402" stroke="#e2e8f0"/>
  <text x="990" y="424" class="sub">Pilot: Nalanda · Bhagalpur ·</text>
  <text x="990" y="440" class="sub">Jhabua</text>

  <!-- ================= BAND 3: DATA + INGEST ================= -->
  <text x="40" y="516" class="band">DATA LAYER  ·  Postgres / Supabase (ap-south-1, Mumbai)</text>
  <rect x="36" y="528" width="760" height="150" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>

  <rect x="54" y="552" width="176" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="142" y="574" text-anchor="middle" class="lbl">Qualifications</text>
  <text x="142" y="592" text-anchor="middle" class="sub">NSQF QPs</text>

  <rect x="246" y="552" width="176" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="334" y="574" text-anchor="middle" class="lbl">Training Centres</text>
  <text x="334" y="592" text-anchor="middle" class="sub">geo + capacity</text>

  <rect x="438" y="552" width="176" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="526" y="574" text-anchor="middle" class="lbl">Demand Signals</text>
  <text x="526" y="592" text-anchor="middle" class="sub">district-level</text>

  <rect x="630" y="552" width="148" height="52" rx="8" fill="#ffffff" stroke="#ea580c"/>
  <text x="704" y="574" text-anchor="middle" class="lbl">Sessions /</text>
  <text x="704" y="590" text-anchor="middle" class="sub">Beneficiaries · Recs</text>

  <text x="54" y="640" class="sub">Every row carries source_url + evidence_date · rows &gt; 180 days drop from scoring</text>
  <text x="54" y="658" class="sub">Phone stored as SHA-256 hash · audio anonymised after 30 days · right-to-erase</text>

  <!-- Ingesters -->
  <text x="820" y="516" class="band">INGEST</text>
  <rect x="820" y="528" width="420" height="150" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="838" y="558" class="lbl">NSQF Ingesters</text>
  <text x="838" y="580" class="sub">NIELIT extract loader (167 QP rows)</text>
  <text x="838" y="600" class="sub">Migrate + seed via bootstrap_db.py</text>
  <text x="838" y="620" class="sub">Weekly refresh (V1.1, scaffolded)</text>
  <line x1="838" y1="636" x2="1222" y2="636" stroke="#e2e8f0"/>
  <text x="838" y="658" class="sub">Deploy: Docker Compose · run.bat auto-detects Supabase vs local</text>

  <!-- ================= CONNECTORS ================= -->
  <!-- beneficiary <-> channels -->
  <line x1="270" y1="160" x2="298" y2="160" stroke="#64748b" marker-end="url(#arrow)"/>
  <line x1="298" y1="180" x2="272" y2="180" stroke="#0d9488" marker-end="url(#arrowUp)"/>
  <text x="256" y="148" class="flow">voice</text>

  <!-- channels -> voice api (down into STT) -->
  <path d="M415,218 L415,255 L118,255 L118,298" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="180" y="250" class="flow">audio in</text>

  <!-- pack sender -> channels (return up) -->
  <path d="M470,398 L470,240 L440,240" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="476" y="300" class="flow">answer pack out</text>

  <!-- ranker <-> data -->
  <path d="M590,370 L590,500 L360,500 L360,550" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="600" y="495" class="flow">query QPs · centres · demand</text>

  <!-- pack sender -> data (write session/recs) -->
  <path d="M760,450 L760,528" fill="none" stroke="#ea580c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="766" y="500" class="flow">write recs</text>

  <!-- dashboard <- data -->
  <path d="M1106,470 L1106,510 L1106,528" fill="none" stroke="#9333ea" stroke-width="1.5" marker-end="url(#arrowUp)"/>
  <text x="1112" y="500" class="flow">read</text>

  <!-- ingest -> data -->
  <path d="M900,528 L900,505 L740,505 L740,552" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="748" y="522" class="flow">seed / load</text>

</svg>
