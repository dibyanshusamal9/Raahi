name: Official Dataset Refresh

# Re-imports the Official India Data Pack into the RAAHI database whenever the
# workbook changes, or on demand from the Actions tab ("Run workflow").
# The project lives in SIH2026/raahi, so every step runs from there.
#
# Needs the repository secret DATABASE_URL: a database GitHub can reach, such
# as Supabase (not one running on a local PC). SLACK_INGEST_WEBHOOK_URL is
# optional and only used to report a failed import.
on:
  push:
    paths:
      - "SIH2026/raahi/data/raw/raahi-official-dataset.xlsx"
  workflow_dispatch: {}

jobs:
  import-dataset:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: SIH2026/raahi
    env:
      # Secrets can't be tested in `if:`, so expose the optional one as env.
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_INGEST_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install pandas psycopg[binary] openpyxl python-dotenv pyarrow

      - name: Apply pending DB migrations
        run: python bootstrap_db.py --migrations-only
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Import Official India Data Pack
        run: python -m ingesters.import_official_dataset
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK_URL != ''
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {"text": "RAAHI dataset import failed — https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
